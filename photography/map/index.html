      (function() {
        var LOG = "[ThemeInit]";
        try {
          var t = localStorage.getItem("theme");
          console.debug(LOG, "Init start.", { storedTheme: t });

          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
            console.debug(LOG, "Applied stored theme.", { theme: t });
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
            console.debug(LOG, "Applied system dark theme.");
          } else {
            console.debug(LOG, "No stored or dark system theme, using light defaults.");
          }

          // Keep in sync if system theme changes while page is open (only when no manual override)
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e) {
            try {
              console.debug(LOG, "System theme changed.", { matchesDark: e.matches });
              if (!localStorage.getItem("theme")) {
                document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
                console.debug(LOG, "Applied system-driven theme change.", {
                  theme: e.matches ? "dark" : "light",
                });
              } else {
                console.debug(LOG, "Ignoring system change due to stored manual theme.");
              }
            } catch(err) {
              console.error(LOG, "Failed handling system theme change.", err);
            }
          });
        } catch(e) {
          console.error(LOG, "Theme initialization failed.", e);
        }
      })();

  (function() {
    var LOG = "[ThemeToggle]";
    var TRANSITION_MS = 550;
    var btn = document.querySelector(".theme-toggle");
    if (!btn) {
      console.error(LOG, "Toggle button not found.");
      return;
    }

    if (btn.getAttribute("data-theme-bound") === "true") {
      console.debug(LOG, "Toggle handler already attached.");
      return;
    }

    btn.setAttribute("data-theme-bound", "true");
    console.debug(LOG, "Binding click handler.", {
      initialThemeAttr: document.documentElement.getAttribute("data-theme"),
    });

    btn.addEventListener("click", function() {
      var html = document.documentElement;
      var current = html.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";

      console.debug(LOG, "Click detected.", {
        currentTheme: current,
        nextTheme: next,
      });

      try {
        html.classList.add("theme-transitioning");
        window.setTimeout(function() {
          html.classList.remove("theme-transitioning");
        }, TRANSITION_MS);
      } catch (err) {
        console.error(LOG, "Failed to apply transition class.", err);
      }

      try {
        html.setAttribute("data-theme", next);
        console.debug(LOG, "Applied data-theme on <html>.", {
          dataTheme: html.getAttribute("data-theme"),
        });
      } catch (err) {
        console.error(LOG, "Failed to set data-theme attribute.", err);
      }

      try {
        localStorage.setItem("theme", next);
        console.debug(LOG, "Persisted theme in localStorage.", {
          storedTheme: localStorage.getItem("theme"),
        });
      } catch (err) {
        console.error(LOG, "Failed to persist theme in localStorage.", err);
      }
    });
  })();
