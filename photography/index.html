      (function() {
        var LOG = "[ThemeInit]";
        try {
          var t = localStorage.getItem("theme");
          console.debug(LOG, "Init start.", { storedTheme: t });

          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
            console.debug(LOG, "Applied stored theme.", { theme: t });
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
            console.debug(LOG, "Applied system dark theme.");
          } else {
            console.debug(LOG, "No stored or dark system theme, using light defaults.");
          }

          // Keep in sync if system theme changes while page is open (only when no manual override)
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e) {
            try {
              console.debug(LOG, "System theme changed.", { matchesDark: e.matches });
              if (!localStorage.getItem("theme")) {
                document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
                console.debug(LOG, "Applied system-driven theme change.", {
                  theme: e.matches ? "dark" : "light",
                });
              } else {
                console.debug(LOG, "Ignoring system change due to stored manual theme.");
              }
            } catch(err) {
              console.error(LOG, "Failed handling system theme change.", err);
            }
          });
        } catch(e) {
          console.error(LOG, "Theme initialization failed.", e);
        }
      })();

  (function() {
    var LOG = "[ThemeToggle]";
    var TRANSITION_MS = 550;
    var btn = document.querySelector(".theme-toggle");
    if (!btn) {
      console.error(LOG, "Toggle button not found.");
      return;
    }

    if (btn.getAttribute("data-theme-bound") === "true") {
      console.debug(LOG, "Toggle handler already attached.");
      return;
    }

    btn.setAttribute("data-theme-bound", "true");
    console.debug(LOG, "Binding click handler.", {
      initialThemeAttr: document.documentElement.getAttribute("data-theme"),
    });

    btn.addEventListener("click", function() {
      var html = document.documentElement;
      var current = html.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";

      console.debug(LOG, "Click detected.", {
        currentTheme: current,
        nextTheme: next,
      });

      try {
        html.classList.add("theme-transitioning");
        window.setTimeout(function() {
          html.classList.remove("theme-transitioning");
        }, TRANSITION_MS);
      } catch (err) {
        console.error(LOG, "Failed to apply transition class.", err);
      }

      try {
        html.setAttribute("data-theme", next);
        console.debug(LOG, "Applied data-theme on <html>.", {
          dataTheme: html.getAttribute("data-theme"),
        });
      } catch (err) {
        console.error(LOG, "Failed to set data-theme attribute.", err);
      }

      try {
        localStorage.setItem("theme", next);
        console.debug(LOG, "Persisted theme in localStorage.", {
          storedTheme: localStorage.getItem("theme"),
        });
      } catch (err) {
        console.error(LOG, "Failed to persist theme in localStorage.", err);
      }
    });
  })();

pt> <script>
    (() => {
      const photoData = JSON.parse(
        document.getElementById("photo-data").textContent.trim()
      );

      const viewer = document.querySelector(".viewer");
      const viewerImage = document.querySelector(".viewer-image");
      const captionEl = document.querySelector(".viewer-caption");
      const infoToggle = document.querySelector(".info-toggle");
      const infoPanel = document.querySelector(".info-panel");
      const closeBtn = document.querySelector(".viewer-close");

      const titleEl = infoPanel.querySelector(".info-title");
      const metaEl = infoPanel.querySelector(".info-meta");
      const settingsEl = infoPanel.querySelector(".info-settings");

      let currentIndex = 0;
      let infoOpen = false;

      function openViewer(index) {
        currentIndex = index;
        const p = photoData[index];

        viewerImage.classList.add("is-loading");
        viewerImage.onload  = () => viewerImage.classList.remove("is-loading");
        viewerImage.onerror = () => viewerImage.classList.remove("is-loading");

        viewerImage.src = p.viewerSrc;
        viewerImage.alt = p.title;
        captionEl.textContent = p.title;

        titleEl.textContent = p.title;
        metaEl.textContent = `${p.location} · ${p.date}`;
        settingsEl.textContent = `${p.camera} · ${p.settings}`;

        infoOpen = false;
        viewer.classList.remove("with-info");

        viewer.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeViewer() {
        viewer.setAttribute("aria-hidden", "true");
        viewer.classList.remove("with-info");
        infoOpen = false;
        document.body.style.overflow = "";
      }

      function toggleInfo() {
        infoOpen = !infoOpen;
        viewer.classList.toggle("with-info", infoOpen);
      }

      function nextPhoto() {
        openViewer((currentIndex + 1) % photoData.length);
      }

      function prevPhoto() {
        openViewer((currentIndex - 1 + photoData.length) % photoData.length);
      }

      /* ── Grid clicks ─────────────────────────── */
      document.querySelectorAll(".photo-grid button").forEach((btn) => {
        btn.addEventListener("click", () => {
          openViewer(Number(btn.dataset.index));
        });
      });

      /* ── Viewer buttons ──────────────────────── */
      infoToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleInfo();
      });

      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        closeViewer();
      });

      /* ── Click backdrop to close ─────────────── */
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer || e.target.classList.contains("viewer-stage")) {
          closeViewer();
        }
      });

      /* ── Keyboard ────────────────────────────── */
      document.addEventListener("keydown", (e) => {
        if (viewer.getAttribute("aria-hidden") === "true") return;

        if (e.key === "Escape") closeViewer();
        if (e.key === "i" || e.key === "I") toggleInfo();
        if (e.key === "ArrowRight") nextPhoto();
        if (e.key === "ArrowLeft") prevPhoto();
      });

      /* ── Touch support ───────────────────────── */
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;

      viewer.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length !== 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        },
        { passive: true }
      );

      viewer.addEventListener(
        "touchend",
        (e) => {
          if (e.changedTouches.length !== 1) return;

          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          const dt = Date.now() - touchStartTime;

          const absDx = Math.abs(dx);
          const absDy = Math.abs(dy);

          // Horizontal swipe
          if (absDx > 50 && absDx > absDy && dt < 500) {
            if (dx > 0) prevPhoto();
            else nextPhoto();
            return;
          }

          // Tap to close
          if (absDx < 10 && absDy < 10 && dt < 300) {
            const tag = e.target.tagName.toLowerCase();
            if (tag !== "button") closeViewer();
          }
        },
        { passive: true }
      );

      /* ── Disable right-click ─────────────────── */
      viewerImage.addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });

      /* ── Deep-link: ?open=N ──────────────────── */
      const params = new URLSearchParams(window.location.search);
      const openParam = params.get("open");
      if (openParam !== null) {
        const idx = parseInt(openParam, 10);
        if (!isNaN(idx) && idx >= 0 && idx < photoData.length) {
          openViewer(idx);
        }
      }
    })();
